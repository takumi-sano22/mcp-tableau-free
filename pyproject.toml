[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-use-sandbox"
version = "0.1.0"
description = "さまざまなMCP・tool useを試す個人用サンドボックス"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
tableau = ["tableauhyperapi>=0.0.20000,<0.1"]

[project.scripts]
tableau-local-mcp = "experiments.tableau_local.server:main"

[tool.setuptools.packages.find]
include = ["experiments*"]
